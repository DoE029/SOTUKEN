<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>忘れ物探知アプリ</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <h1>忘れ物探知 Webアプリ</h1>

    <div class="weather-card">
        <span class="weather-icon">☁️</span>
        <span class="weather-text">今日の天気: <strong>{{ weather }}</strong></span>
    </div>

    <section class="tag-status">
        <h2>🏷 タグの状態</h2>
        <ul>
            <li>
                <span>タグA</span>
                <span class="status in">検知</span>
            </li>
            <li>
                <span>タグB</span>
                <span class="status out">未検知</span>
            </li>
        </ul>
    </section>

    <p>※ 現在はテスト表示です。MAIN.pyと連携準備中。</p>
</body>
</html>
